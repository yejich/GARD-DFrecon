seed: 42
precision: fp32
encoder: depth-anything/DA3-GIANT-1.1
checkpoint: /mnt/nvme1n1/yejichoi/GARD-DFrecon/ckpts/gard_denoiser.pt
resolution: 504
workers: 2
per_gpu_batch_size: 1
accumulation: 4
steps_per_epoch: 2500
epochs: 30
lr: 0.0002
warmup_epochs: 5
ema_decay: 0.9995
novel_weight: 1.0
log_interval: 10
checkpoint_interval: 250
save_ema_epochs: [1, 3, 10, 20, 30]
eval_epochs: []
nvs_branch: true
full_view_loss: true
flowmap_from: noise_lq
mask_aware_attention: false
model:
  in_channels: 1536
  hidden_size: [1536, 3072]
  depth: [8, 6]
  num_heads: [16, 16]
  mlp_ratio: 4.0
  use_qknorm: true
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  wo_shift: false
  use_pos_embed: false
  use_global_residual: false
  mask_head_enabled: false
data:
  name: stage1
  manifest: /mnt/nvme1n1/yejichoi/GARD-DFrecon/data/phase1_nvs_manifest.json
nvs:
  total_views: 4
  min_source_views: 1
  max_source_views: 3
group_mse:
  mode: group2
  lambda_clean: 1.0
  lambda_distractor: 1.0
distractor_loss:
  mode: none
  lambda_coeff: 0.0
attention_alignment:
  use: false
  lambda_coeff: 0.0
  mvrm_layer_idx: 9
  hard_self_view_for_distractor: false
  distractor_aware:
    use: false
  da3_point_cloud:
    use: false
wandb:
  enabled: false
  entity: null
  project: GARD-DFrecon
  name: gard_stage1_nvs

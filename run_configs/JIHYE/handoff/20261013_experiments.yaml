seed: 42
precision: bf16
encoder: depth-anything/DA3-GIANT-1.1
checkpoint: ckpts/gard_denoiser.pt
resolution: 504
global_batch: 16
microbatch: 1
steps_per_epoch: 500
epochs: 30
lr: 0.0002
warmup_epochs: 15
warmup_from_zero: false
ema_decay: 0.9995
workers: 2
negative_probability: 0.5
log_interval: 5
checkpoint_interval: 500
save_epochs: [1, 3, 10, 20, 30]
eval_epochs: [1, 3, 10, 20, 30]
eval_num_steps: 50
eval_limit: 0
eval_fail_fast: false
novel_weight: 1.0
noise_lvl: 0.3
model:
  in_channels: 1536
  hidden_size: [1536, 3072]
  depth: [8, 6]
  num_heads: [16, 16]
  mlp_ratio: 4.0
  use_qknorm: true
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  wo_shift: false
  use_pos_embed: false
  use_global_residual: false
  mask_head_enabled: false
group_mse:
  mode: group2
  lambda_clean: 1.0
  lambda_distractor: 1.0
attention_alignment:
  use: true
  lambda_coeff: 1.0
  mvrm_layer_idx: 9
  distractor_aware:
    use: false
    cross_view_only_for_distractor: true
    max_correspondence_distance: 0.03
    balance_query_groups: true
    lambda_distractor: 1.0
    lambda_clean: 1.0
  da3_point_cloud:
    use: true
    vis_pc_temperature: 0.01
    visibility_mask: cycle_consistency
    vis_pc_cycle_threshold: 1.5
    reprojection_depth_threshold: 0.1
experiments:
  baseline_transient_off: {dataset: transient, nvs: false, flow: legacy, camera: none, distractor_aware: false}
  baseline_mixed_off: {dataset: mixed, nvs: false, flow: legacy, camera: none, distractor_aware: false}
  baseline_mixed_on: {dataset: mixed, nvs: false, flow: legacy, camera: none, distractor_aware: true}
  nvs_legacy_target: {dataset: mixed, nvs: true, flow: legacy, camera: target, distractor_aware: true}
  nvs_legacy_source_target: {dataset: mixed, nvs: true, flow: legacy, camera: source_target, distractor_aware: true}
  nvs_pure_noise_target: {dataset: mixed, nvs: true, flow: pure_noise, camera: target, distractor_aware: true}
  nvs_pure_noise_source_target: {dataset: mixed, nvs: true, flow: pure_noise, camera: source_target, distractor_aware: true}
  nvs_pseudo_lq_target: {dataset: mixed, nvs: true, flow: pseudo_lq, camera: target, distractor_aware: true}
  nvs_pseudo_lq_source_target: {dataset: mixed, nvs: true, flow: pseudo_lq, camera: source_target, distractor_aware: true}
